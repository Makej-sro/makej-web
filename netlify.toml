# Kanonické jsou adresy bez .html — ty už má Google v indexu a Netlify je obsluhuje sám.
# Verze s .html ale zůstávala dostupná paralelně (obojí vracelo 200), takže každá
# stránka existovala na dvou adresách a web si konkuroval sám se sebou.
# force = true je nutné: soubor .html fyzicky existuje, bez toho by Netlify poslal jeho
# obsah a k přesměrování by se nedostal.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/hledam-si-praci.html"
  to = "/hledam-si-praci"
  status = 301
  force = true

