<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Tři nabídky práce ve stohu, vrchní se swipuje doprava">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001bc8"/>
      <stop offset="0.55" stop-color="#0020f6"/>
      <stop offset="1" stop-color="#2a44ff"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#dfe4ff" stop-opacity=".95"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <circle cx="474" cy="86" r="150" fill="#ffffff" opacity=".05"/>

  <!-- stoh nabídek: dvě vzadu vykukují vlevo, vrchní se swipuje doprava -->
  <g transform="translate(258 200)">
    <g transform="translate(-46 6) rotate(-16)">
      <rect x="-62" y="-84" width="124" height="168" rx="18" fill="#ffffff" opacity=".2"/>
    </g>
    <g transform="translate(-24 2) rotate(-8)">
      <rect x="-66" y="-88" width="132" height="176" rx="19" fill="#ffffff" opacity=".38"/>
    </g>
    <g transform="rotate(6) translate(-70 -92)">
      <rect width="140" height="184" rx="20" fill="url(#sheen)"/>
      <rect x="18" y="20" width="52" height="52" rx="15" fill="#0020f6" opacity=".14"/>
      <circle cx="44" cy="46" r="15" fill="#0020f6" opacity=".55"/>
      <rect x="18" y="88"  width="104" height="11" rx="5.5" fill="#0a0d2e" opacity=".72"/>
      <rect x="18" y="108" width="72"  height="9"  rx="4.5" fill="#0a0d2e" opacity=".28"/>
      <rect x="18" y="138" width="60"  height="24" rx="12"  fill="#0020f6" opacity=".16"/>
      <rect x="27" y="147" width="42"  height="7"  rx="3.5" fill="#0020f6" opacity=".75"/>
    </g>
  </g>

  <!-- swipe doprava -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M368 200h48" stroke-width="7" opacity=".92"/>
    <path d="M400 183l17 17-17 17" stroke-width="7" opacity=".92"/>
    <path d="M352 200h8" stroke-width="7" opacity=".42"/>
    <path d="M336 200h5" stroke-width="7" opacity=".2"/>
  </g>
</svg>
