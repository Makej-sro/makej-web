<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Podepsaná dohoda s razítkem">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00158f"/>
      <stop offset="0.5" stop-color="#0020f6"/>
      <stop offset="1" stop-color="#1a35ff"/>
    </linearGradient>
    <pattern id="grid2" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e8ff"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg2)"/>
  <rect width="600" height="400" fill="url(#grid2)"/>
  <circle cx="128" cy="330" r="150" fill="#ffffff" opacity=".05"/>

  <!-- list dohody -->
  <g transform="translate(300 200)">
    <rect x="-98" y="-108" width="188" height="212" rx="16" fill="#ffffff" opacity=".2"/>
    <g transform="translate(-84 -100)">
      <rect width="176" height="200" rx="15" fill="url(#paper)"/>
      <!-- ohnutý roh -->
      <path d="M176 0v34h-34z" fill="#0020f6" opacity=".12"/>
      <!-- řádky textu -->
      <rect x="22" y="52"  width="94"  height="9" rx="4.5" fill="#0a0d2e" opacity=".68"/>
      <rect x="22" y="74"  width="132" height="7" rx="3.5" fill="#0a0d2e" opacity=".2"/>
      <rect x="22" y="90"  width="118" height="7" rx="3.5" fill="#0a0d2e" opacity=".2"/>
      <rect x="22" y="106" width="128" height="7" rx="3.5" fill="#0a0d2e" opacity=".2"/>
      <!-- podpisová linka + podpis -->
      <rect x="22" y="160" width="88" height="4" rx="2" fill="#0a0d2e" opacity=".22"/>
      <path d="M26 154c9-16 15 6 22-6s10 10 18-2 12 6 20-4"
            fill="none" stroke="#0020f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
    </g>
    <!-- razítko -->
    <g transform="translate(74 62)">
      <circle r="34" fill="#0020f6" stroke="#ffffff" stroke-width="4" opacity=".96"/>
      <circle r="25" fill="none" stroke="#ffffff" stroke-width="2" opacity=".55"/>
      <path d="M-11 1l7.5 8L12 -7" fill="none" stroke="#ffffff" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
