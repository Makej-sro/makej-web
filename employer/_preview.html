<!doctype html><html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Náhled — opravený Kandidáti tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#eef2ff;font-family:"League Spartan",system-ui,sans-serif}
  @keyframes empSpin{to{transform:rotate(360deg)}}
  @keyframes empPop{0%{transform:scale(.92) translateY(12px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
  @keyframes mkBubbleIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes onlinePulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 5px rgba(34,197,94,0)}}
  .banner{background:#0020F6;color:#fff;padding:10px 18px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center}
  .banner b{font-weight:800}
  .frame{height:calc(100vh - 40px);background:#fff;display:flex;flex-direction:column;overflow:hidden}
  #root{flex:1;min-height:0;display:flex}
</style>
</head><body>
<div class="banner">🔍 <b>NÁHLED opraveného Kandidáti tabu</b> — ukázkoví uchazeči v reálném tvaru dat (věk/vzdálenost = null jako u skutečných). Klikni na kartu → detail. <span id="status" style="margin-left:auto;opacity:.8"></span></div>
<div class="frame"><div id="root"></div></div>

<script>
const setStatus = s => { const el=document.getElementById('status'); if(el) el.textContent=s; };
window.addEventListener('error', e => setStatus('CHYBA: ' + (e.error && e.error.message ? e.error.message : e.message)));

// Stub Supabase — náhled nesmí sáhnout na reálnou databázi
const chan = { on(){return chan;}, subscribe(){return chan;} };
const qb = { select(){return qb;}, eq(){return qb;}, order(){return qb;}, in(){return qb;}, not(){return qb;}, limit(){return qb;}, single(){return Promise.resolve({data:null,error:null});}, insert(){return qb;}, update(){return qb;} };
window.sb = {
  auth:{ getSession:()=>Promise.resolve({data:{session:null}}), onAuthStateChange(){return {data:{subscription:{unsubscribe(){}}}};}, signOut(){return Promise.resolve();} },
  channel:()=>chan, removeChannel(){}, from:()=>qb,
};

const files = ['app.jsx','employer-data.jsx','employer-shell.jsx','employer-dashboard.jsx','employer-pages.jsx','employer-pages3.jsx','_premium/analytics.jsx','employer-supabase.jsx'];

(async () => {
  let blob = '';
  for (const f of files) {
    const code = await (await fetch(f + '?t=' + Date.now())).text();
    blob += '\n;/*FILE ' + f + '*/\n' + code;
  }
  try {
    const out = Babel.transform(blob, { presets: ['react'] }).code;
    (new Function(out))();
  } catch (err) { setStatus('CHYBA při načítání: ' + err.message); return; }

  // Ukázkoví uchazeči v PŘESNĚ takovém tvaru, jaký vrací Supabase (toCandidate):
  // rating je string, age a distance jsou null, match je 0.
  window.E_CANDIDATES.new = [
    { id:'m1', match_id:'m1', job_id:'j1', worker_id:'w1', name:'Jan Novák',        avatar:'JN', color:'#5B6BFF', age:null, rating:'4.9', jobsDone:23, distance:null, level:7, match:0, tags:['Gastro','Latte art'], lastSeen:'právě teď · 14:20', jobTitle:'Barista do specialty kavárny', status:'pending' },
    { id:'m2', match_id:'m2', job_id:'j1', worker_id:'w2', name:'Petra Svobodová',  avatar:'PS', color:'#F4A261', age:null, rating:'4.6', jobsDone:8,  distance:null, level:4, match:0, tags:['Gastro','Víkendy'], lastSeen:'před 12 min · 14:08', jobTitle:'Servírka — víkendová směna', status:'pending' },
    { id:'m3', match_id:'m3', job_id:'j2', worker_id:'w3', name:'Martin Kučera',    avatar:'MK', color:'#5BD68A', age:null, rating:'5.0', jobsDone:17, distance:null, level:9, match:0, tags:['Bar','Barista'], lastSeen:'před 1 h · 13:15', jobTitle:'Barista do specialty kavárny', status:'pending' },
    { id:'m4', match_id:'m4', job_id:'j2', worker_id:'w4', name:'Lucie Horáková',   avatar:'LH', color:'#E0B0FF', age:null, rating:'0.0', jobsDone:0,  distance:null, level:1, match:0, tags:[], lastSeen:'včera · 18:40', jobTitle:'Servírka — víkendová směna', status:'pending' },
  ];
  window.E_CANDIDATES.hired = [
    { id:'m5', match_id:'m5', job_id:'j1', worker_id:'w5', name:'Adam Dvořák',      avatar:'AD', color:'#FFD166', age:null, rating:'4.8', jobsDone:31, distance:null, level:8, match:0, tags:['Gastro','AJ'], lastSeen:'před 3 h · 11:30', jobTitle:'Barista do specialty kavárny', status:'accepted' },
  ];
  window.E_CANDIDATES.shortlist = [];
  window.E_CANDIDATES.interview = [];

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.ECandidates));
  setStatus('✓ reálná komponenta ECandidates · 5 ukázkových uchazečů');
})();
</script>
</body></html>
