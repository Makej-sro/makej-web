    /* ── Jednotný rám záložek (krok 1 sjednocení, 25. 9.) ──
       Každá záložka si dřív rám kreslila sama: jiný okraj (18/20 px), jiná
       max. šířka (1180 px jen u Inzerátů, Nastavení, Analytiky), jinak vysoká
       modrá hlavička (67–83 px). Při přepnutí proto obsah poskočil.
       Záložky mají na kořeni třídu e-ram a na hlavičce e-hlav; tady se
       jim vnutí stejné míry (!important přebíjí inline styly z JSX).
       Posuvník: místo pro něj je rezervované vždy (scrollbar-gutter), jinak
       se u dlouhých záložek objevil, obsah se zúžil a posunul o pár px.
       Jen pro počítač — mobil má vlastní rozvržení a zůstává, jak byl. */
    main { scrollbar-gutter: stable; }
    /* Jedno čistě bílé pozadí na všech záložkách (26. 9.). Dřív měla stránka
       #F1F3FB, rám záložky jiný odstín s vlastním obrysem a karty bílou —
       tři různé bílé a dvě čáry vedle sebe. Rám teď splývá se stránkou,
       zůstává jen modrá hlavička a karty obsahu. */
    .e-ram > div { background: #fff !important; border-color: transparent !important; }
    /* Hlavička záložky bez modré plochy (26. 9.) — jen název a akce vpravo
       (komponenta ETabHlava v employer-shell.jsx). Stejná výška všude, ať
       název při přepínání záložek neskáče. */
    .e-hlav { padding: 10px 24px 18px; box-sizing: border-box; }
    @media (min-width: 821px) {
      .e-ram {
        width: 100% !important; max-width: 1480px !important; margin: 0 auto !important;
        padding: 20px !important; box-sizing: border-box !important;
      }
      .e-hlav { min-height: 70px; align-items: center !important; }
      /* Pevná obrazovka na každé záložce (28. 9.): stránka sama nescrolluje.
         Nadpis a pás čísel stojí, posouvá se jen obsah pod nimi (poslední
         dítě karty). Seznamy s vlastním posuvníkem (Zprávy, Inzeráty) si
         výšku berou z tohohle prostoru. Mobil zůstává, jak byl. */
      main.e-hlavni:has(.e-ram) { overflow-y: hidden !important; scrollbar-gutter: auto; }
      .e-ram { flex: 1 1 auto; min-height: 0; height: 100%; display: flex; flex-direction: column; }
      .e-ram > div { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
      .e-ram > div > * { flex: none; }
      .e-ram > div > :last-child { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: none; }
      /* Kandidáti (29. 9.): rám bez okrajů — seznam až ke spodnímu kraji okna a řádky
         karet do stran (vlevo až k čárce menu); odsazení obsahu drží komponenta */
      .e-ram.e-ram-dolu { padding: 0 !important; max-width: none !important; }
      .e-ram.e-ram-dolu > div { border-radius: 0 !important; }
      /* Výjimka: Profil firmy se posouvá celý jako dřív (i s nadpisem) —
         je to jeden dlouhý dokument, ne seznam. Třída e-volne na kořeni. */
      main.e-hlavni:has(.e-ram.e-volne) { overflow-y: auto !important; scrollbar-gutter: stable; }
      .e-ram.e-volne { flex: none; height: auto; display: block; }
      .e-ram.e-volne > div { display: block; }
      .e-ram.e-volne > div > :last-child { overflow: visible; }
      /* Bez pružení (28. 9.): Mac při dotažení na konec nebo při točení
         kolečkem mimo posuvnou část „odpruží" stránku a obsah poskočí.
         Pevná obrazovka se nemá hýbat vůbec — posun ani pružení se nepřenáší
         dál na stránku. Jen na posuvné prvky: na kartě s overflow:hidden by
         „none" zablokovalo předání kolečka seznamu a ten by nešel posunout. */
      html, body, main.e-hlavni, main.e-hlavni [style*="overflow-y: auto"], .e-jb-scroll { overscroll-behavior: none; }
      /* Inzeráty: seznam vyplní zbytek karty pod filtry (místo odhadu 100vh − 358 px) */
      main .e-jb-scroll { max-height: none; flex: 0 1 auto; min-height: 0; }
    }
    /* Klikací čísla v pásu: celé políčko je odkaz, při najetí se podbarví */
    /* Klikací políčko v pásu čísel: při najetí zmodrá (barva Makej), text

    /* Bez přechodu (transition): barva pozadí a textu se prolínaly každá

    .e-pruh-klik:hover span { color: rgba(255,255,255,.78) !important; }
    .e-pruh-klik:hover .e-pruh-v { color: #fff !important; }

    .e-jb-rad { display: grid; grid-template-columns: minmax(0,1fr) 104px 96px 96px 150px 20px; align-items: center; gap: 14px; padding: 12px 20px; border-top: 1px solid #F0F2FA; }

    .e-jb-hlav { border-top: none; padding: 11px 20px; font-size: 12px; font-weight: 600; color: #7A82A6; background: #FBFCFE; border-bottom: 1px solid #EEF0F6; }

    .e-jb-klik { cursor: pointer; transition: background .12s; }
    .e-jb-klik:hover { background: #F6F7FC; }
    .e-jb-klik:focus-visible { outline: 2px solid #0020F6; outline-offset: -2px; }
    /* Levé menu: posuvník skrytý. Na nižší obrazovce se v úzkém pruhu (72 px)
       objevil a ubral ~10 px — položky se zúžily, ikona přestala být uprostřed

    .e-menu { scrollbar-width: none; }
    .e-menu::-webkit-scrollbar { display: none; }
    /* Úchyt menu (jako Stripe): svislá čárka vedle menu, při najetí šipka */
    .e-uchyt { position: absolute; top: 50%; right: -22px; width: 24px; height: 44px; margin-top: -22px; padding: 0; border: none; background: transparent; cursor: pointer; z-index: 45; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .e-uchyt span { display: block; width: 4px; height: 12px; border-radius: 4px; background: #C9CEDD; transition: transform .22s cubic-bezier(.2,.8,.2,1), background .18s; }
    /* v klidu šedá čárka, při najetí modrá šipka */
    .e-uchyt:hover span, .e-uchyt:focus-visible span { background: #0020F6; }
    .e-uchyt-tip { position: absolute; left: calc(100% + 2px); top: 50%; transform: translate(-4px, -50%); font-style: normal; white-space: nowrap; pointer-events: none;
      background: #0020F6; color: #fff; font-size: 12.5px; font-weight: 600; line-height: 1; padding: 7px 10px; border-radius: 7px; box-shadow: 0 6px 16px -6px rgba(0,32,246,.45);
      opacity: 0; transition: opacity .15s ease, transform .15s ease; }
    .e-uchyt:hover .e-uchyt-tip, .e-uchyt:focus-visible .e-uchyt-tip { opacity: 1; transform: translate(0, -50%); transition-delay: .12s; }
    .e-uchyt .e-uchyt-h { transform-origin: 50% 100%; margin-bottom: -1px; }
    .e-uchyt .e-uchyt-d { transform-origin: 50% 0%; margin-top: -1px; }
    /* otevřené menu → šipka doleva ‹ (sbalit), zavřené → doprava › (rozbalit) */
    .e-uchyt:hover .e-uchyt-h, .e-uchyt:focus-visible .e-uchyt-h { transform: translateX(-2px) rotate(22deg); }

    .e-uchyt.zavreno:hover .e-uchyt-h, .e-uchyt.zavreno:focus-visible .e-uchyt-h { transform: translateX(2px) rotate(-22deg); }
    .e-uchyt.zavreno:hover .e-uchyt-d, .e-uchyt.zavreno:focus-visible .e-uchyt-d { transform: translateX(2px) rotate(22deg); }
    #root .e-uchyt:focus-visible { outline: none; }
    /* Úchyt pásu čísel (EMetriky, 29. 9.) — jako úchyt menu, jen naležato: dvě čárky vedle
       sebe = vodorovná linka pod pásem; při najetí šipka ^ (skrýt) / v (ukázat) */
    .e-uchyt-v { position: absolute; left: 50%; bottom: -21px; width: 44px; height: 22px; margin-left: -22px; padding: 0; border: none; background: transparent; cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center; }
    .e-uchyt-v > span { display: block; width: 12px; height: 4px; border-radius: 4px; background: #C9CEDD; transition: transform .22s cubic-bezier(.2,.8,.2,1), background .18s; }
    .e-uchyt-v:hover > span, .e-uchyt-v:focus-visible > span { background: #0020F6; }
    .e-uchyt-v .e-uchyt-l { transform-origin: 100% 50%; margin-right: -1px; }
    .e-uchyt-v .e-uchyt-p { transform-origin: 0% 50%; margin-left: -1px; }
    .e-uchyt-v:hover .e-uchyt-l, .e-uchyt-v:focus-visible .e-uchyt-l { transform: translateY(-2px) rotate(-22deg); }

    .e-uchyt-v.zavreno:hover .e-uchyt-l, .e-uchyt-v.zavreno:focus-visible .e-uchyt-l { transform: translateY(2px) rotate(22deg); }
    .e-uchyt-v.zavreno:hover .e-uchyt-p, .e-uchyt-v.zavreno:focus-visible .e-uchyt-p { transform: translateY(2px) rotate(-22deg); }
    .e-uchyt-v:hover .e-uchyt-tip, .e-uchyt-v:focus-visible .e-uchyt-tip { opacity: 1; transform: translate(0, -50%); transition-delay: .12s; }

    .e-cal-den:not(:disabled):not(.kraj):hover { background: #EEF1FF !important; }
    /* Položky roletky Období: při najetí ztmavnou (vybraná je modrá, při najetí o stupeň sytější) */

    .e-jb-karta { transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease; }

    /* Stav karty v seznamu inzerátů (29. 9.) — barvou jako štítek skupiny: urgentní fialový
       rámeček, naplněné modrý rámeček a lehce ztlumené, neaktivní šedé (fotka i modrý podklad
       bez barev). Při najetí se vrátí do plných barev, ať nepůsobí jako vypnuté tlačítko. */
    .e-jb-karta[data-stav="asap"] { border-color: #C6A2FF !important; box-shadow: 0 0 0 3px rgba(139,61,255,.13); }
    .e-jb-karta[data-stav="asap"]:hover { border-color: #A874FF !important; box-shadow: 0 0 0 3px rgba(139,61,255,.16), 0 16px 36px -18px rgba(16,24,64,.35); }
    .e-jb-karta[data-stav="filled"] { border-color: #C3CBF6 !important; }
    .e-jb-karta[data-stav="inactive"], .e-jb-karta[data-stav="filled"] { transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease, opacity .18s ease; }
    .e-jb-karta[data-stav="inactive"] { opacity: .72; }

    /* ── Odznáček stupně důvěry brigádníka — 1:1 z appky (www/index.html .wlvl). Při změně v appce zkopírovat znovu. */
    .wlvl { position: relative; display: inline-flex; align-items: center; justify-content: center; font-family: inherit; vertical-align: middle; }
    .wlvl__pill {
      position: relative; overflow: hidden; display: inline-block;
      padding: 5px 13px; border-radius: 999px;
      font-size: 12px; font-weight: 800; letter-spacing: .2px; white-space: nowrap;
      color: var(--lv-text); border: 1px solid var(--lv-edge);
      background-image: var(--lv-metal); background-size: 260% 100%;
      box-shadow: inset 0 1px 0 var(--lv-top-light), inset 0 -1px 0 var(--lv-bottom-dark), var(--lv-drop-shadow);
      animation: var(--lv-anim, none);
    }
    .wlvl__sheen {
      position: absolute; top: -40%; left: 0; width: var(--lv-sheen-width); height: 180%; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, var(--lv-sheen) 50%, rgba(255,255,255,0) 100%);
      animation: wLvlSheen var(--lv-sheen-dur) var(--lv-sheen-ease) infinite; animation-delay: var(--lv-sheen-delay);
    }
    .wlvl__aura {
      position: absolute; inset: -8px; border-radius: 999px; pointer-events: none;
      background: radial-gradient(60% 70% at 50% 50%, var(--lv-aura) 0%, rgba(255,255,255,0) 72%);
      animation: wLvlAura 7s ease-in-out infinite;
    }
    .wlvl--sm .wlvl__pill { padding: 4px 10px; font-size: 11px; }
    .wlvl--sm .wlvl__aura { inset: -7px; }
    .wlvl--lg .wlvl__pill { padding: 7px 16px; font-size: 13.5px; }
    /* Zamčený (ještě nedosažený) stupeň — ztlumený, bez animací, ať je vidět jak vypadá */
    .wlvl--locked { opacity: .48; filter: saturate(.8); }
    .wlvl--locked .wlvl__pill { animation: none; }
    .wlvl--locked .wlvl__sheen, .wlvl--locked .wlvl__aura { display: none; }

    .wlvl[data-level="new"] {
      --lv-metal: linear-gradient(105deg, #CFE2F5 0%, #E4F0FB 22%, #F6FBFF 42%, #BCD6EE 62%, #A8C7E4 82%, #DCEAF8 100%);
      --lv-text: #173A5E; --lv-edge: #9DBBD8;
      --lv-top-light: rgba(255,255,255,.9); --lv-bottom-dark: rgba(23,58,94,.2);
      --lv-sheen: rgba(255,255,255,.95); --lv-drop-shadow: 0 1px 3px -1px rgba(60,95,135,.35);
      --lv-anim: none; --lv-sheen-dur: 13s; --lv-sheen-ease: ease-in-out; --lv-sheen-delay: 0s; --lv-sheen-width: 22px;
    }
    .wlvl[data-level="reliable"] {
      --lv-metal: linear-gradient(105deg, #0C6F62 0%, #128C7B 22%, #24B39B 42%, #0F7E6E 62%, #095B50 82%, #1AA08C 100%);
      --lv-text: #FFFFFF; --lv-edge: #095B50;
      --lv-top-light: rgba(196,244,232,.5); --lv-bottom-dark: rgba(3,40,34,.48);
      --lv-sheen: rgba(238,255,250,.9); --lv-drop-shadow: 0 2px 7px -2px rgba(12,111,98,.55);
      --lv-anim: wLvlMetal 12s ease-in-out infinite -1.4s; --lv-sheen-dur: 10s; --lv-sheen-ease: ease-in-out; --lv-sheen-delay: -1s; --lv-sheen-width: 28px;
    }
    .wlvl[data-level="verified"] {
      --lv-metal: linear-gradient(105deg, #1878C4 0%, #2D93E0 22%, #58B4F0 42%, #2384D2 62%, #1466A8 82%, #3EA0E8 100%);
      --lv-text: #FFFFFF; --lv-edge: #1466A8;
      --lv-top-light: rgba(214,239,255,.55); --lv-bottom-dark: rgba(6,44,80,.45);
      --lv-sheen: rgba(240,250,255,.92); --lv-drop-shadow: 0 3px 10px -3px rgba(24,120,196,.6);
      --lv-anim: wLvlMetal 10s ease-in-out infinite -2.6s; --lv-sheen-dur: 8.5s; --lv-sheen-ease: cubic-bezier(.5,0,.3,1); --lv-sheen-delay: -2s; --lv-sheen-width: 30px;
    }
    .wlvl[data-level="top"] {
      --lv-metal: linear-gradient(105deg, #08090C 0%, #2B2F38 16%, #6E7481 32%, #C9CEDA 46%, #8E93A4 60%, #33373F 76%, #101218 90%, #08090C 100%);
      --lv-text: #F0CE72; --lv-edge: #0A0B0F;
      --lv-top-light: rgba(226,232,244,.45); --lv-bottom-dark: rgba(0,0,0,.55);
      --lv-sheen: rgba(245,249,255,.95); --lv-drop-shadow: 0 5px 15px -3px rgba(10,12,18,.65);
      --lv-anim: wLvlMetal 8.5s ease-in-out infinite -3.4s, wLvlPearl 14s linear infinite;
      --lv-sheen-dur: 7s; --lv-sheen-ease: cubic-bezier(.5,0,.3,1); --lv-sheen-delay: -1.6s; --lv-sheen-width: 34px; --lv-aura: rgba(200,208,225,.7);

    @keyframes wLvlMetal { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes wLvlSheen { 0%, 8% { transform: translateX(-200%) skewX(-22deg); } 46%, 100% { transform: translateX(900%) skewX(-22deg); } }
    @keyframes wLvlPearl { 0%, 100% { filter: hue-rotate(-14deg) saturate(1.05); } 50% { filter: hue-rotate(14deg) saturate(1.2); } }
    @keyframes wLvlAura  { 0%, 100% { opacity: .22; transform: scale(1); } 50% { opacity: .6; transform: scale(1.16); } }
    @media (prefers-reduced-motion: reduce) {
      .wlvl__pill, .wlvl__sheen, .wlvl__aura { animation: none; }
      .wlvl__sheen, .wlvl__aura { display: none; }
    }
    /* Filtrační lišta v úsporném režimu (EFiltrLista, 28. 9.): řazení
       i hledání jen jako ikonky; hledání se po kliknutí rozbalí doleva
       přes lištu a po vymazání a odkliknutí se zase schová. */
    .e-filtr-ikona { display: none; }
    .e-filtr.kompakt .e-filtr-txt { display: none; }
    .e-filtr.kompakt .e-filtr-ikona { display: block; }
    .e-filtr.kompakt .e-filtr-razeni > button { width: 38px; padding: 0 !important; justify-content: center; }
    .e-filtr.kompakt .e-filtr-menu { left: auto !important; right: 0; }
    .e-filtr.kompakt .e-filtr-hledat { width: 38px; height: 38px; }
    .e-filtr.kompakt .e-filtr-hledat input { position: absolute; right: 0; top: 0; z-index: 3; width: 38px !important; padding: 0 !important; background: #fff !important; cursor: pointer; transition: width .18s ease; }
    .e-filtr.kompakt .e-filtr-hledat input:not(:focus):placeholder-shown::placeholder { color: transparent; }
    .e-filtr.kompakt .e-filtr-hledat svg { left: auto !important; right: 11px; }
    .e-filtr.kompakt .e-filtr-hledat input:focus,
    .e-filtr.kompakt .e-filtr-hledat input:not(:placeholder-shown) { width: 260px !important; padding: 0 33px 0 12px !important; cursor: text; border-color: #1B34F0 !important; box-shadow: 0 6px 18px -8px rgba(16,24,64,.25); }
    @keyframes eDotazIn { from { opacity: 0; } to { opacity: 1; } }
    .e-btn-hl:hover:not(:disabled) { background: #0F27D9 !important; }
    .e-btn-sek:hover:not(:disabled) { background: #F6F7FC !important; }
    @media (max-width: 820px) {
      .e-pruh { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
      .e-hlav { padding: 8px 16px 14px; }
      .e-pruh-ram { padding: 0 16px !important; }
    }

    /* ── Přechod mezi záložkami ──
       Data jsou načtená předem, takže se nic nenačítá — jde jen o to, aby
       přepnutí nevypadalo jako tvrdé probliknutí. Rám a modrá hlavička stojí
       (je na stejném místě na všech záložkách), obsah pod ní najede zdola
       po částech: pás čísel → levý sloupec → pravý sloupec. Stejně na všech
       záložkách. `backwards`, ne `both` — po doběhnutí nesmí zůstat transform
       (rozbil by position:fixed u oken otevřených uvnitř záložky). */
    @keyframes eObsahIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    /* Pás čísel (2. část) najede jako celek, tělo (3. část) po sloupcích.
       Hlavička s názvem stojí. */
    .e-ram > div > :nth-child(2):not(.e-hlav) > * { animation: eObsahIn .34s cubic-bezier(.2,.8,.2,1) .02s backwards; }
    .e-ram > div > :nth-child(n+4):not(.e-hlav) { animation: eObsahIn .34s cubic-bezier(.2,.8,.2,1) .2s backwards; }
    /* Sloupce těla (mřížka pod pásem čísel) jeden po druhém */
    .e-ram > div > :nth-child(3) > * { animation: eObsahIn .34s cubic-bezier(.2,.8,.2,1) backwards; }
    .e-ram > div > :nth-child(3) > :nth-child(1) { animation-delay: .07s; }
    .e-ram > div > :nth-child(3) > :nth-child(2) { animation-delay: .13s; }
    .e-ram > div > :nth-child(3) > :nth-child(n+3) { animation-delay: .18s; }
    @media (prefers-reduced-motion: reduce) {
      .e-ram > div > *, .e-ram > div > :nth-child(2) > *, .e-ram > div > :nth-child(3) > * { animation: none !important; }
    }

    /* Profil firmy — řádky údajů upravované na místě (employer-firma.jsx) */
    .e-pf-inp { width: 100%; font-size: 14px; font-weight: 600; color: #0B1233; background: transparent;
      border: 1px solid transparent; border-radius: 9px; padding: 8px 10px; outline: none; transition: background .15s, border-color .15s; }
    .e-pf-inp:hover { background: #F6F7FC; }
    .e-pf-inp:focus { background: #fff; border-color: #1B34F0; }
    .e-pf-inp::placeholder { color: #1B34F0; opacity: .75; font-weight: 700; }
    select.e-pf-inp { cursor: pointer; }

    /* Menu karty firmy v levém menu */
    @keyframes eKartaIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    /* Obrys po kliknutí myší (černý rámeček na připínáčku) — jen pro klávesnici */
    #root button:focus:not(:focus-visible) { outline: none; }
    #root button:focus-visible { outline: 2px solid #0020F6; outline-offset: 2px; }

    /* Kolečka výběru data (období „Vlastní") — schovaný scrollbar, snap zajišťuje JS */
    .e-wheel { scrollbar-width: none; -ms-overflow-style: none; }
    .e-wheel::-webkit-scrollbar { display: none; }

    /* Lokální scroll uvnitř karty (dashboard apod.) — tenký nenápadný scrollbar; hlavička a pás metrik zůstávají připnuté */
    .e-localscroll { scrollbar-width: thin; scrollbar-color: #D5DAF0 transparent; }
    .e-localscroll::-webkit-scrollbar { width: 9px; }
    .e-localscroll::-webkit-scrollbar-thumb { background: #D5DAF0; border-radius: 9px; }
    .e-localscroll::-webkit-scrollbar-thumb:hover { background: #C2C8E4; }
    .e-localscroll::-webkit-scrollbar-track { background: transparent; }

    /* Inzeráty — sonar tečky vyžití tarifu + rozjezd segmentů fáze náboru */
    @keyframes dotSonar { 0% { box-shadow: 0 0 0 0 rgba(92,240,168,.55), 0 0 12px rgba(92,240,168,.5); } 70% { box-shadow: 0 0 0 11px rgba(92,240,168,0), 0 0 12px rgba(92,240,168,.5); } 100% { box-shadow: 0 0 0 0 rgba(92,240,168,0), 0 0 12px rgba(92,240,168,.5); } }
    @keyframes segFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    /* Nový / upravit inzerát — najetí okna, přechod kroků, roztřesení kroku s chybou */
    @keyframes njModalIn { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes njFadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    /* Roletka v okně inzerátu (_NjRoletka) — seznam se rozbalí od pole */
    @keyframes njRolIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes njShake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
    /* Odezva ovládacích prvků v okně inzerátu (28. 9.) — najetí změní barvu,
       hlavní tlačítko se lehce zvedne, stisk prvek krátce zmáčkne (jako na webu).
       data-on = vybraná volba (modrá). !important kvůli inline stylům. */
    .nj-hl, .nj-sek, .nj-ghost, .nj-chip, .nj-typ, .nj-x, .nj-krok, .nj-plus, .nj-volba {
      transition: background-color .16s ease, border-color .16s ease, color .16s ease, box-shadow .18s ease, transform .18s cubic-bezier(.2,.8,.2,1);
      -webkit-user-select: none; user-select: none; }
    .nj-hl:hover { background: #0F27D9 !important; box-shadow: 0 8px 18px -8px rgba(27,52,240,.65); transform: translateY(-1px); }
    .nj-sek:hover { background: #F6F7FC !important; border-color: #D5DAF0 !important; color: #0B1233 !important; }
    .nj-ghost:hover { background: #F6F7FC !important; color: #0B1233 !important; }
    .nj-chip:not([data-on]):hover { border-color: #B9C2F2 !important; background: #F8F9FF !important; color: #0B1233 !important; }
    .nj-chip[data-on]:hover { background: #0F27D9 !important; border-color: #0F27D9 !important; }
    .nj-typ:not([data-on]):hover { border-color: #B9C2F2 !important; background: #FAFBFF !important; }
    .nj-volba:not([data-on]):hover { background: #F6F7FC !important; color: #0B1233 !important; }
    .nj-x:hover { background: #EEF1FF !important; color: #1B34F0 !important; }
    .nj-plus:hover { border-color: #B9C2F2 !important; color: #1B34F0 !important; }
    .nj-krok:not([data-on]):hover > span:last-child { color: #0B1233 !important; }
    /* Zlatý kov s tekoucím leskem — pilulka TOP, tlačítko Topovat a okno topování. 1:1 se zlatým
       odznáčkem „Byl jsem u toho" z waitlistu (makej-web 6.7/style.css → .gold-badge; v appce
       WGoldBadge / WTopBadge). Prvek potřebuje uvnitř <span class="e-zlato__lesk">. */
    @keyframes eGoldFlow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes eGoldSheen { 0%, 8% { transform: translateX(-160%) skewX(-22deg); } 46%, 100% { transform: translateX(420%) skewX(-22deg); } }
    .e-zlato { position: relative; overflow: hidden; color: #221A05 !important; border: 1px solid #A5780C !important;
      background: linear-gradient(105deg, #B8860B 0%, #E8C56A 22%, #FDF3C8 42%, #D9A93C 62%, #A9770A 82%, #E4C069 100%) !important;
      background-size: 260% 100% !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.65), inset 0 -1px 0 rgba(90,60,0,.35), 0 2px 6px -2px rgba(140,96,10,.5);
      animation: eGoldFlow 7s ease-in-out infinite; }
    .e-zlato__lesk { position: absolute; top: -40%; left: 0; width: 34px; height: 180%; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.9) 50%, rgba(255,255,255,0) 100%);
      animation: eGoldSheen 4.5s ease-in-out infinite; }
    button.e-zlato { transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease, filter .18s ease; }
    button.e-zlato:hover { transform: translateY(-1px); filter: brightness(1.06) saturate(1.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(90,60,0,.35), 0 10px 20px -10px rgba(140,96,10,.75); }
    button.e-zlato:active { transform: scale(.97); transition-duration: .08s; }
    @media (prefers-reduced-motion: reduce) { .e-zlato, .e-zlato__lesk { animation: none; } button.e-zlato:hover { transform: none; } }
    /* Tlačítka v detailu inzerátu (Kandidáti, Statistiky, Upravit) — při najetí zmodrají */
    .e-det-tl, .e-det-boost { transition: background-color .16s ease, border-color .16s ease, color .16s ease, transform .16s ease; }
    .e-det-tl:hover { color: #1B34F0 !important; background: #EEF1FF !important; border-color: #B9C2F2 !important; }
    .e-det-boost:hover { background: #F5B820 !important; border-color: #E0A50C !important; }
    .e-det-tl:active, .e-det-boost:active { transform: scale(.97); }
    .nj-odkaz { transition: color .16s; }
    /* Fotky inzerátu: ovládání (✕, ‹ ›) až při najetí na fotku */
    .nj-foto .nj-foto-akce { opacity: 0; transition: opacity .15s ease; }
    .nj-foto:hover .nj-foto-akce { opacity: 1; }
    .nj-foto:active { cursor: grabbing; }
    .nj-odkaz:hover { color: #0F27D9 !important; text-decoration: underline; text-underline-offset: 3px; }
    .nj-hl:active, .nj-sek:active, .nj-ghost:active, .nj-x:active, .nj-plus:active { transform: scale(.96); transition-duration: .08s; }
    .nj-chip:active, .nj-typ:active, .nj-volba:active { transform: scale(.97); transition-duration: .08s; }
    .nj-inp { transition: border-color .16s ease, background-color .16s ease, box-shadow .16s ease; }
    .nj-inp:hover { border-color: #C9D0EE !important; }
    .nj-inp:focus, .nj-inp:focus-within { border-color: #1B34F0 !important; background: #fff !important; box-shadow: 0 0 0 3px rgba(27,52,240,.12); }
    @media (max-width: 980px) { .nj-nahled { display: none !important; } .nj-telo { grid-template-columns: 1fr !important; } }
    @media (prefers-reduced-motion: reduce) { .nj-hl:hover { transform: none; } }

    /* ── Odznáčky tarifů (TierBadge) — efekt roste s cenou ── */
    .tier-badge { position: relative; display: inline-flex; align-items: center; justify-content: center; perspective: 400px; }
    /* dashboard má #root * { font: Inter !important } → přebíjíme specifičtějším !important */
    #root .tier-badge, #root .tier-badge__pill { font-family: 'Poppins', sans-serif !important; }
    .tier-badge__pill {
      position: relative; overflow: hidden; display: inline-block;
      padding: 5px 13px; border-radius: 999px;
      font-size: 12px; font-weight: 700; letter-spacing: .2px; white-space: nowrap;
      color: var(--tier-text); border: 1px solid var(--tier-edge);
      background-image: var(--tier-metal); background-size: 260% 100%;
      box-shadow: inset 0 1px 0 var(--tier-top-light), inset 0 -1px 0 var(--tier-bottom-dark), var(--tier-drop-shadow);
      animation: var(--tier-anim, none);
    }
    .tier-badge__sheen {
      position: absolute; top: -40%; left: 0; width: var(--tier-sheen-width); height: 180%; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, var(--tier-sheen) 50%, rgba(255,255,255,0) 100%);
      animation: sheenSweep var(--tier-sheen-dur) var(--tier-sheen-ease) infinite; animation-delay: var(--tier-sheen-delay);
    }
    .tier-badge__aura {
      position: absolute; inset: -7px; border-radius: 999px; pointer-events: none;
      background: radial-gradient(60% 70% at 50% 50%, var(--tier-aura) 0%, rgba(255,255,255,0) 72%);
      animation: auraPulse 3.4s ease-in-out infinite; animation-delay: var(--tier-aura-delay, 0s);
    }
    .tier-badge__sparks { position: absolute; inset: -10px; pointer-events: none; }
    .tier-badge__sparks i { position: absolute; background: radial-gradient(50% 50% at 50% 50%, #fff 0%, rgba(255,255,255,0) 70%); animation: sparkPop 2.6s ease-in-out infinite; }

    .tier-badge[data-tier="free"] {
      --tier-metal: linear-gradient(105deg, #9AA6BF 0%, #CDD6E6 22%, #F4F7FC 42%, #B7C1D6 62%, #8E9AB4 82%, #C9D2E3 100%);
      --tier-text: #1B2437; --tier-edge: #8B96AE;
      --tier-top-light: rgba(255,255,255,.8); --tier-bottom-dark: rgba(40,52,75,.3);
      --tier-sheen: rgba(255,255,255,.95); --tier-drop-shadow: 0 1px 3px -1px rgba(90,105,135,.4);
      --tier-anim: none; --tier-sheen-dur: 8s; --tier-sheen-ease: ease-in-out; --tier-sheen-delay: 0s; --tier-sheen-width: 22px;
    }
    .tier-badge[data-tier="value"] {
      --tier-metal: linear-gradient(105deg, #0E11B4 0%, #2E33F0 22%, #5A60F0 42%, #1D21DC 62%, #0B0D96 82%, #3438E8 100%);
      --tier-text: #FFFFFF; --tier-edge: #0B0D96;
      --tier-top-light: rgba(190,195,255,.6); --tier-bottom-dark: rgba(4,6,60,.5);
      --tier-sheen: rgba(235,240,255,.9); --tier-drop-shadow: 0 2px 6px -2px rgba(20,23,230,.5);
      --tier-anim: metalFlow 7s ease-in-out infinite -1.2s; --tier-sheen-dur: 5s; --tier-sheen-ease: ease-in-out; --tier-sheen-delay: -.9s; --tier-sheen-width: 28px;
    }
    .tier-badge[data-tier="dynamic"] {
      --tier-metal: linear-gradient(105deg, #0F7A3D 0%, #229B54 22%, #3EB871 42%, #178F49 62%, #0B6532 82%, #2FA862 100%);
      --tier-text: #FFFFFF; --tier-edge: #0B6532;
      --tier-top-light: rgba(198,246,216,.6); --tier-bottom-dark: rgba(4,45,22,.45);
      --tier-sheen: rgba(240,255,246,.9); --tier-drop-shadow: 0 2px 8px -2px rgba(15,122,61,.5);
      --tier-anim: metalFlow 5.5s ease-in-out infinite -2.4s; --tier-sheen-dur: 4s; --tier-sheen-ease: cubic-bezier(.5,0,.3,1); --tier-sheen-delay: -1.8s; --tier-sheen-width: 30px;
    }
    .tier-badge[data-tier="max"] {
      --tier-metal: linear-gradient(105deg, #8F3A0C 0%, #BE5518 22%, #DC7434 42%, #B04D14 62%, #7C310A 82%, #C9601F 100%);
      --tier-text: #FFFFFF; --tier-edge: #7C310A;
      --tier-top-light: rgba(255,214,180,.55); --tier-bottom-dark: rgba(60,22,4,.5);
      --tier-sheen: rgba(255,240,225,.9); --tier-drop-shadow: 0 4px 12px -3px rgba(143,58,12,.6);
      --tier-anim: metalFlow 4.5s ease-in-out infinite -3.6s, badgeTilt 5s ease-in-out infinite;
      --tier-sheen-dur: 3.4s; --tier-sheen-ease: cubic-bezier(.5,0,.3,1); --tier-sheen-delay: -2.7s; --tier-sheen-width: 34px;
      --tier-aura: rgba(216,116,52,.75); --tier-aura-delay: -3.6s;

    .tier-badge[data-tier="custom"] {
      --tier-metal: linear-gradient(105deg, #5B2A9E 0%, #7A41C8 22%, #9C6BE0 42%, #7439C4 62%, #4A1F86 82%, #8A54D4 100%);
      --tier-text: #FFFFFF; --tier-edge: #4A1F86;
      --tier-top-light: rgba(226,205,252,.6); --tier-bottom-dark: rgba(35,10,70,.5);
      --tier-sheen: rgba(250,243,255,.9); --tier-drop-shadow: 0 5px 14px -3px rgba(91,42,158,.65);
      --tier-anim: metalFlow 3.6s ease-in-out infinite -4.8s, badgeTilt 4.2s ease-in-out infinite;
      --tier-sheen-dur: 2.8s; --tier-sheen-ease: cubic-bezier(.5,0,.3,1); --tier-sheen-delay: -3.6s; --tier-sheen-width: 34px;
      --tier-aura: rgba(156,107,224,.8); --tier-aura-delay: -4.8s;
    }
    /* ── Efekty tarifů (Yasin 27. 9., nová verze makej-tier-effects.css) ──
       Kovový text (název tarifu v ceníku), přelévavý barevný text, kovový
       odznáček (karta firmy v menu) a kovové tlačítko (ceník). Kov kreslí
       metal-fx (WebGL2); tady jsou barvy tarifů pro jeho plátna (knihovna
       má jeden preset na stránku → barva přes CSS filtr) a CSS náhrada,
       když WebGL2 není. Písmo necháváme naše (Inter). */
    /* Kovové nápisy a tlačítka (.mk-grad, .mk-rim) jsou v /cenik.css — sdílí je web. */
    @keyframes metalFlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes sheenSweep { 0%,8% { transform: translateX(-200%) skewX(-22deg); } 46%,100% { transform: translateX(900%) skewX(-22deg); } }
    @keyframes badgeTilt { 0%,100% { transform: rotateY(-9deg) rotateX(4deg); } 50% { transform: rotateY(9deg) rotateX(-4deg); } }
    @keyframes auraPulse { 0%,100% { opacity: .22; transform: scale(1); } 50% { opacity: .6; transform: scale(1.16); } }
    @keyframes sparkPop { 0%,100% { opacity: 0; transform: scale(.4) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(90deg); } }
    @media (prefers-reduced-motion: reduce) {
      .tier-badge__pill, .tier-badge__sheen, .tier-badge__aura, .tier-badge__sparks i { animation: none; }
      .tier-badge__sheen, .tier-badge__aura, .tier-badge__sparks { display: none; }
    }
  </style>
</head>
<body>

  <!-- Zámek dashboardu. Přihlášení řeší web — jedno, s rozcestníkem firma/
       brigádník. Nepřihlášený se tu jen krátce zastaví, než ho JS pošle tam. -->
  <div id="auth-gate" class="nahr-plocha" role="status">
    <div class="nahr-obsah">
      <canvas id="gate-orb" aria-hidden="true"></canvas>
      <p class="nahr-text" id="gate-msg">Nahráváme vaše údaje</p>
      <!-- Stejné řádky jako načítání v appce (www/index.html, .load__t2),
           ať se obě obrazovky neliší. Druhý přibude po 10 s, taky jako v appce. -->
      <p class="nahr-pod" id="gate-pod">Zabere to jen chvilku. Nezavírejte prosím okno.</p>
      <p class="nahr-pod" id="gate-dlouho" hidden>Ještě to chvíli potrvá…</p>
    </div>
  </div>
  <!-- Orb (thinking-orbs, MIT) bez Reactu — viz /vendor/thinking-orbs/orb.js.
       Když se nenačte, zůstanou aspoň tečky za textem. -->
  <script>
    // Okamžik kliknutí na „Přihlásit se" (web ho uložil) — modrá od něj drží
    // nejméně 5 s. Kdo sem přijde přímo, tomu se počítá od otevření stránky.
    window.__nahrOd = (function () {
      try {
        const u = Number(sessionStorage.getItem('makej-nahr-od'));
        if (u && Date.now() - u < 20000) return u;
      } catch (e) {}
      return Date.now();
    })();
  </script>
  <!-- blocking="render": stránka se ukáže až s nakresleným orbem (první
       snímek se kreslí hned při spuštění), takže orb naskočí spolu s textem
       a nedopadne později. Do té doby prohlížeč drží modrou z webu. -->
  <script type="module" async blocking="render">
    import { spustOrb } from '/vendor/thinking-orbs/orb.js?v=4';
    window.__zastavOrb = spustOrb(document.getElementById('gate-orb'), { state: 'connecting', size: 64, zobrazit: 104 });
  </script>

  <div id="root"></div>

  <!-- Velké skripty až TADY, ne v <head>. Dokud je prohlížeč nestáhne
       a nespustí (Babel má 3 MB), nesmí nic vykreslit — po přihlášení se
       proto na vteřinu zasekl poslední obraz webu a pak stránka „problikla".
       Modrá obrazovka výš se teď vykreslí dřív, než se na ně začne čekat. -->
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <!-- Kovový odznáček tarifu (metal-fx, MIT — /vendor/metal-fx/). Modul se
       spustí až po Reactu výš; do té doby / bez WebGL2 kreslí menu CSS verzi
       (.mk-rim). Kurzorové světlo vypnuté, jako v návrhu. -->
  <script type="module">
    import * as MFX from '/vendor/metal-fx/metal-fx.js?v=2';
    try { MFX.setCursorLightConfig({ cursor: false }); } catch (e) {}
    window.MetalFxLib = MFX;
    window.dispatchEvent(new Event('metalfx-ready'));
  </script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script>
    // ── Auth gate ──
    const SUPABASE_URL = 'https://cxegfwfbgcgpwerfbvra.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_N_BIwMCTD6ZOTrtBl3juyw_CGIQ_lvh';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, storageKey: 'makej-auth' }
    });

    const gate = document.getElementById('auth-gate');
    const gateMsg = document.getElementById('gate-msg');
    const gatePod = document.getElementById('gate-pod');
    const gateDlouho = document.getElementById('gate-dlouho');
    // Modrá odejde, až je dashboard OPRAVDU vykreslený — ne ve chvíli, kdy se
    // ověří přihlášení. Mezi tím se v prohlížeči ještě 2–4 s překládá 12
    // souborů JSX; dřív se zámek schoval hned a člověk koukal na prázdnou
    // tmavou plochu, která vypadala jako rozbitá stránka.
    function hideGate() {
      const root = document.getElementById('root');
      let pojistka = 0;
      // Modrá svítí nejméně 5 s od kliknutí na „Přihlásit se" (web to uloží do
      // sessionStorage), bez ohledu na rychlost počítače. Dashboard se totiž
      // vykreslí dřív, než do něj dotečou data z databáze — delší modrá to
      // schová a dashboard naskočí rovnou naplněný. Kdo sem přijde přímo
      // (záložka, obnovení), tomu se to počítá od otevření stránky.
      const MIN_MODRA = 5000;
      // Po 10 s od kliknutí přidat „Ještě to chvíli potrvá…" (stejně jako
      // appka), ať člověk neusoudí, že to zamrzlo.
      const dlouho = setTimeout(() => { gateDlouho.hidden = false; },
        Math.max(0, (window.__nahrOd || Date.now()) + 10000 - Date.now()));
      // window.__nahrOd nastavil skript hned pod zámkem: čerstvý čas kliknutí
      // z webu, jinak otevření stránky. Záznam se nemaže — čte ho i orb a
      // pořadí obou skriptů není zaručené; starý záznam odfiltruje 20s limit.
      const od = window.__nahrOd || performance.timeOrigin || Date.now();
      const hotovo = () => {
        clearTimeout(pojistka);
        clearTimeout(dlouho);
        const zbyva = Math.max(0, od + MIN_MODRA - Date.now());
        setTimeout(odejdi, zbyva);
      };
      const odejdi = () => {
        // Snímek navíc, ať se dashboard stihne pod modrou vykreslit celý.
        requestAnimationFrame(() => requestAnimationFrame(() => {
          gate.classList.add('odchazi');
          root.classList.add('nahr-dovnitr');
          setTimeout(() => {
            gate.classList.add('hidden');
            if (window.__zastavOrb) window.__zastavOrb();
          }, 650);
        }));
      };
      // Čeká se na NAČTENÁ DATA, ne jen na první vykreslení. Dřív stačilo, že
      // se v #root něco objevilo — jenže to byla i mezinačítačka „Načítám
      // data…", a když databáze odpovídala déle než 5 s (typicky refresh),
      // modrá odešla a pod ní se točil kroužek. Signál posílá employer-main.jsx.
      if (window.__empDataNactena) return hotovo();
      window.addEventListener('emp-data-nactena', hotovo, { once: true });
      // Kdyby se dashboard nenačetl vůbec (spadlý skript, výpadek sítě),
      // nenechat člověka navždy na modré — říct to a nabídnout znovu.
      pojistka = setTimeout(() => {
        if (window.__empDataNactena) return;
        gateMsg.textContent = 'Načítání trvá déle, než by mělo.';
        clearTimeout(dlouho); gatePod.hidden = true; gateDlouho.hidden = true;
        const obsah = gate.querySelector('.nahr-obsah');
        const p = document.createElement('p'); p.className = 'nahr-chyba';
        p.textContent = 'Zkontrolujte připojení a zkuste to znovu.';
        const b = document.createElement('button'); b.className = 'nahr-znovu'; b.type = 'button';
        b.textContent = 'Zkusit znovu'; b.onclick = () => location.reload();
        obsah.append(p, b);
      }, 25000);
    }

    // Přihlášení má na starost web — jedno, s rozcestníkem firma/brigádník.
    // Přihlášená firma jde rovnou do dashboardu; kdokoli jiný (nepřihlášený
    // nebo brigádník) se pošle na to webové přihlášení s předvybranou rolí.
    sb.auth.getSession().then(({ data: { session } }) => {
      const role = session?.user?.user_metadata?.role;
      if (session && role === 'employer') {
        hideGate();
        return;
      }
      // Nic se nenahrává, jen přesměrovává — „nezavírejte okno" by tu mátlo.
      gatePod.hidden = true;
      if (session && role !== 'employer') {
        // Přihlášený brigádník na adrese dashboardu → jasná hláška, pak pryč
        gateMsg.textContent = 'Tento dashboard je jen pro zaměstnavatele. Přesměrování…';
      } else {
        gateMsg.textContent = 'Přesměrování na přihlášení…';
      }
      window.location.replace('/?login=employer');
    });
  </script>
