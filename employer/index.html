  <style>
    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; }
    html, body {
      margin: 0; padding: 0;
      background: #e8ecfb;
      font-family: "Plus Jakarta Sans", -apple-system, system-ui, sans-serif;

      overflow: hidden;
    }
    iconify-icon { display: inline-flex; line-height: 0; }
    @keyframes empSpin { to { transform: rotate(360deg); } }
    @keyframes empPop { 0% { transform: scale(0.92) translateY(12px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes empRecPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes empToastBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    /* Auth gate */
    #auth-gate {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #2a2ab5 0%, #050510 100%);
      z-index: 9999;
    }
    #auth-gate.hidden { display: none; }
    .gate-card {
      background: rgba(22,22,59,0.9);
      border: 1px solid rgba(208,208,255,0.12);
      border-radius: 1.5rem;
      padding: 2.5rem;
      width: min(420px, calc(100vw - 40px));
      text-align: center;
    }
    .gate-logo {
      font-family: Inter, sans-serif;
      font-size: 2.2rem; font-weight: 900;
      background: linear-gradient(135deg, #7c7cff, #d0d0ff);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }
    .gate-sub { color: #FFD166; font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 1.75rem; }
    .gate-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem; color: #fff; }
    .gate-desc { color: #9999cc; font-size: 0.9rem; margin-bottom: 1.75rem; }
    .gate-error { background: rgba(244,63,94,0.12); border: 1px solid rgba(244,63,94,0.3); border-radius: 0.75rem; padding: 10px 14px; color: #f87171; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    .gate-input {
      width: 100%; padding: 11px 15px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(208,208,255,0.14);
      border-radius: 0.75rem;
      color: #fff; font-family: inherit; font-size: 0.95rem;

    .gate-input:focus { border-color: rgba(208,208,255,0.4); }

    .gate-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #292978, #3a3a99);
      border: none; border-radius: 0.75rem;
      color: #fff; font-family: inherit; font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-bottom: 1rem; transition: opacity .2s;
    }
    .gate-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(208,208,255,0.12); border-radius: 8px; }

    button { font-family: inherit; }
    input { font-family: inherit; }

    /* ─────────────────────────────────────────────────────────
       MOBILNÍ RESPONZIVITA — dashboard je jinak fixní desktop layout.
       Inline React styly nejdou přepsat mediou přes classy, ale
       !important atributový selektor přebije nedůležité inline styly.
       Cílíme na hodnoty gridů tak, jak je React vykreslí do style="".
       ───────────────────────────────────────────────────────── */
    @media (max-width: 820px) {
      [style*="repeat(4, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; }
      [style*="repeat(3, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; }
      /* dlouhé stránky nechme scrollovat na výšku i uvnitř */
      html, body, #root { height: 100%; }
    }
    @media (max-width: 520px) {
      [style*="repeat(4, 1fr)"],
      [style*="repeat(3, 1fr)"],
      [style*="repeat(2, 1fr)"],
      [style*="repeat(2, minmax(0, 1fr)"] { grid-template-columns: 1fr !important; }
    }

    /* ── Odznáčky tarifů (TierBadge) — efekt roste s cenou ── */
    .tier-badge { position: relative; display: inline-flex; align-items: center; justify-content: center; perspective: 400px; }
    /* dashboard má #root * { font: Inter !important } → přebíjíme specifičtějším !important */
    #root .tier-badge, #root .tier-badge__pill { font-family: 'Poppins', sans-serif !important; }
    .tier-badge__pill {
      position: relative; overflow: hidden; display: inline-block;
      padding: 5px 13px; border-radius: 999px;
      font-size: 12px; font-weight: 700; letter-spacing: .2px; white-space: nowrap;
      color: var(--tier-text); border: 1px solid var(--tier-edge);
      background-image: var(--tier-metal); background-size: 260% 100%;
      box-shadow: inset 0 1px 0 var(--tier-top-light), inset 0 -1px 0 var(--tier-bottom-dark), var(--tier-drop-shadow);
      animation: var(--tier-anim, none);
    }
    .tier-badge__sheen {
      position: absolute; top: -40%; left: 0; width: var(--tier-sheen-width); height: 180%; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, var(--tier-sheen) 50%, rgba(255,255,255,0) 100%);
      animation: sheenSweep var(--tier-sheen-dur) var(--tier-sheen-ease) infinite; animation-delay: var(--tier-sheen-delay);
    }
    .tier-badge__aura {
      position: absolute; inset: -7px; border-radius: 999px; pointer-events: none;
      background: radial-gradient(60% 70% at 50% 50%, var(--tier-aura) 0%, rgba(255,255,255,0) 72%);
      animation: auraPulse 3.4s ease-in-out infinite; animation-delay: var(--tier-aura-delay, 0s);
    }
    .tier-badge__sparks { position: absolute; inset: -10px; pointer-events: none; }
    .tier-badge__sparks i { position: absolute; background: radial-gradient(50% 50% at 50% 50%, #fff 0%, rgba(255,255,255,0) 70%); animation: sparkPop 2.6s ease-in-out infinite; }

    .tier-badge[data-tier="free"] {
      --tier-metal: linear-gradient(105deg, #9AA6BF 0%, #CDD6E6 22%, #F4F7FC 42%, #B7C1D6 62%, #8E9AB4 82%, #C9D2E3 100%);
      --tier-text: #1B2437; --tier-edge: #8B96AE;
      --tier-top-light: rgba(255,255,255,.8); --tier-bottom-dark: rgba(40,52,75,.3);
      --tier-sheen: rgba(255,255,255,.95); --tier-drop-shadow: 0 1px 3px -1px rgba(90,105,135,.4);
      --tier-anim: none; --tier-sheen-dur: 8s; --tier-sheen-ease: ease-in-out; --tier-sheen-delay: 0s; --tier-sheen-width: 22px;
    }
    .tier-badge[data-tier="value"] {
      --tier-metal: linear-gradient(105deg, #0E11B4 0%, #2E33F0 22%, #5A60F0 42%, #1D21DC 62%, #0B0D96 82%, #3438E8 100%);
      --tier-text: #FFFFFF; --tier-edge: #0B0D96;
      --tier-top-light: rgba(190,195,255,.6); --tier-bottom-dark: rgba(4,6,60,.5);
      --tier-sheen: rgba(235,240,255,.9); --tier-drop-shadow: 0 2px 6px -2px rgba(20,23,230,.5);
      --tier-anim: metalFlow 7s ease-in-out infinite -1.2s; --tier-sheen-dur: 5s; --tier-sheen-ease: ease-in-out; --tier-sheen-delay: -.9s; --tier-sheen-width: 28px;
    }
    .tier-badge[data-tier="dynamic"] {
      --tier-metal: linear-gradient(105deg, #0F7A3D 0%, #229B54 22%, #3EB871 42%, #178F49 62%, #0B6532 82%, #2FA862 100%);
      --tier-text: #FFFFFF; --tier-edge: #0B6532;
      --tier-top-light: rgba(198,246,216,.6); --tier-bottom-dark: rgba(4,45,22,.45);
      --tier-sheen: rgba(240,255,246,.9); --tier-drop-shadow: 0 2px 8px -2px rgba(15,122,61,.5);
      --tier-anim: metalFlow 5.5s ease-in-out infinite -2.4s; --tier-sheen-dur: 4s; --tier-sheen-ease: cubic-bezier(.5,0,.3,1); --tier-sheen-delay: -1.8s; --tier-sheen-width: 30px;
    }
    .tier-badge[data-tier="max"] {
      --tier-metal: linear-gradient(105deg, #8F3A0C 0%, #BE5518 22%, #DC7434 42%, #B04D14 62%, #7C310A 82%, #C9601F 100%);
      --tier-text: #FFFFFF; --tier-edge: #7C310A;
      --tier-top-light: rgba(255,214,180,.55); --tier-bottom-dark: rgba(60,22,4,.5);
      --tier-sheen: rgba(255,240,225,.9); --tier-drop-shadow: 0 4px 12px -3px rgba(143,58,12,.6);
      --tier-anim: metalFlow 4.5s ease-in-out infinite -3.6s, badgeTilt 5s ease-in-out infinite;
      --tier-sheen-dur: 3.4s; --tier-sheen-ease: cubic-bezier(.5,0,.3,1); --tier-sheen-delay: -2.7s; --tier-sheen-width: 34px;
      --tier-aura: rgba(216,116,52,.75); --tier-aura-delay: -3.6s;
    }
    .tier-badge[data-tier="custom"] {
      --tier-metal: linear-gradient(105deg, #5B2A9E 0%, #7A41C8 22%, #9C6BE0 42%, #7439C4 62%, #4A1F86 82%, #8A54D4 100%);
      --tier-text: #FFFFFF; --tier-edge: #4A1F86;
      --tier-top-light: rgba(226,205,252,.6); --tier-bottom-dark: rgba(35,10,70,.5);
      --tier-sheen: rgba(250,243,255,.9); --tier-drop-shadow: 0 5px 14px -3px rgba(91,42,158,.65);
      --tier-anim: metalFlow 3.6s ease-in-out infinite -4.8s, badgeTilt 4.2s ease-in-out infinite;
      --tier-sheen-dur: 2.8s; --tier-sheen-ease: cubic-bezier(.5,0,.3,1); --tier-sheen-delay: -3.6s; --tier-sheen-width: 34px;
      --tier-aura: rgba(156,107,224,.8); --tier-aura-delay: -4.8s;
    }
    @keyframes metalFlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes sheenSweep { 0%,8% { transform: translateX(-200%) skewX(-22deg); } 46%,100% { transform: translateX(900%) skewX(-22deg); } }
    @keyframes badgeTilt { 0%,100% { transform: rotateY(-9deg) rotateX(4deg); } 50% { transform: rotateY(9deg) rotateX(-4deg); } }
    @keyframes auraPulse { 0%,100% { opacity: .22; transform: scale(1); } 50% { opacity: .6; transform: scale(1.16); } }
    @keyframes sparkPop { 0%,100% { opacity: 0; transform: scale(.4) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(90deg); } }
    @media (prefers-reduced-motion: reduce) {
      .tier-badge__pill, .tier-badge__sheen, .tier-badge__aura, .tier-badge__sparks i { animation: none; }
    }

    /* Datumový „revolver" picker (den·měsíc·rok) */
    .w-wheel { scrollbar-width: none; -ms-overflow-style: none; }
    .w-wheel::-webkit-scrollbar { display: none; }
    @keyframes wPop { 0% { transform: scale(0.96) translateY(-6px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
  </style>

<body>

  <!-- Auth gate — zobrazí se dokud není ověřen zaměstnavatel -->
  <div id="auth-gate">
    <div class="gate-card">
      <div class="gate-logo">makej!</div>
      <div class="gate-sub">for business</div>
      <div class="gate-title">Přihlásit se</div>
      <div class="gate-desc">Dashboard je dostupný pouze pro zaměstnavatele.</div>
      <div class="gate-error" id="gate-error"></div>
      <input class="gate-input" type="email" id="gate-email" placeholder="tvuj@email.cz" autocomplete="email" />
      <input class="gate-input" type="password" id="gate-password" placeholder="Heslo" autocomplete="current-password" />
      <button class="gate-btn" id="gate-submit">Přihlásit se</button>
      <button class="gate-back" onclick="window.location.href='../'">← Zpět na makej.cz</button>
    </div>
  </div>

  <!-- Rozcestník pracovních prostorů -->
  <div id="ws-chooser" style="position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:linear-gradient(180deg,#2a2ab5 0%,#050510 100%); z-index:9998; padding:20px;">
    <div class="gate-card">
      <div class="gate-logo">makej!</div>
      <div class="gate-sub">for business</div>
      <div class="gate-title">Kam chceš jít?</div>
      <div class="gate-desc">Vyber pracovní prostor.</div>
      <div id="ws-list" style="display:flex; flex-direction:column; gap:10px; text-align:left; margin-bottom:14px;"></div>
      <button class="gate-back" id="ws-signout">Odhlásit se</button>
    </div>
  </div>

  <div id="root"></div>

  <script>
    // ── Auth gate ──
    const SUPABASE_URL = 'https://cxegfwfbgcgpwerfbvra.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_N_BIwMCTD6ZOTrtBl3juyw_CGIQ_lvh';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, storageKey: 'makej-auth' }
    });

    const gate = document.getElementById('auth-gate');
    const gateError = document.getElementById('gate-error');
    const gateSubmit = document.getElementById('gate-submit');
    const chooser = document.getElementById('ws-chooser');

    function showGate() { gate.classList.remove('hidden'); }
    function hideGate() { gate.classList.add('hidden'); }
    function showChooser() { chooser.style.display = 'flex'; }
    function hideChooser() { chooser.style.display = 'none'; }
    function resetSubmit() { gateSubmit.disabled = false; gateSubmit.textContent = 'Přihlásit se'; }
    function showGateError(msg) { gateError.textContent = msg; gateError.style.display = 'block'; }

    function translateGateError(msg) {
      if (msg.includes('Invalid login credentials'))  return 'Nesprávný email nebo heslo.';
      if (msg.includes('Email not confirmed'))         return 'Nejdřív potvrď svůj email.';
      if (msg.includes('missing'))                     return 'Zadejte email a heslo.';
      if (msg.includes('Password should be at least')) return 'Heslo musí mít alespoň 6 znaků.';
      if (msg.includes('rate limit'))                  return 'Příliš mnoho pokusů, zkus to za chvíli.';
      if (msg.includes('invalid') && msg.includes('email')) return 'Zadejte platný email.';
      return msg;
    }
    function roleLabel(r) { return ({ admin:'Admin', recruiter:'Náborář', accountant:'Účetní', viewer:'Jen ke čtení', member:'Člen týmu' })[r] || 'Člen týmu'; }
    function escapeHtml(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

    // Vstup do vybraného prostoru → oznam React appce
    function enterWorkspace(ownerId) {
      window._makejActingId = ownerId;
      hideChooser(); hideGate();
      window.dispatchEvent(new CustomEvent('makej-workspace', { detail: ownerId }));
    }

    function renderChooser(options) {
      const list = document.getElementById('ws-list');
      list.innerHTML = '';
      options.forEach(o => {
        const b = document.createElement('button');
        b.className = 'gate-btn';
        b.style.cssText = 'display:flex; align-items:center; gap:12px; text-align:left; margin-bottom:0;';
        const sub = o.personal ? 'Tvůj osobní účet' : ('Firma · ' + roleLabel(o.role));
        b.innerHTML = '<span style="font-size:1.4rem; line-height:1;">' + (o.personal ? '🧍' : '🏢') + '</span>'
          + '<span style="display:flex; flex-direction:column; gap:2px;">'
          + '<span style="font-weight:800;">' + escapeHtml(o.name) + '</span>'
          + '<span style="font-size:0.72rem; font-weight:600; opacity:0.85;">' + sub + '</span></span>';
        b.addEventListener('click', () => enterWorkspace(o.id));
        list.appendChild(b);
      });
    }

    async function proceed(session) {
      // 1) přijetí pozvánky z odkazu ?join=<token>
      const params = new URLSearchParams(window.location.search);
      const joinToken = params.get('join');
      if (joinToken) {
        try { await sb.rpc('claim_team_invite', { p_token: joinToken }); } catch (e) { console.error('claim invite:', e); }
        params.delete('join');
        const qs = params.toString();
        history.replaceState({}, '', window.location.pathname + (qs ? '?' + qs : ''));
      }
      // 2) sestav dostupné pracovní prostory
      const isEmployer = session.user?.user_metadata?.role === 'employer';
      let memberships = [];
      try { const { data } = await sb.rpc('my_workspaces'); memberships = data || []; } catch (e) { console.error('my_workspaces:', e); }

      const options = [];
      if (isEmployer) options.push({ id: session.user.id, name: 'Můj účet', personal: true });
      memberships.forEach(m => options.push({ id: m.owner_id, name: m.company_name, personal: false, role: m.role }));

      if (options.length === 0) {
        await sb.auth.signOut();
        showGateError('Tento účet nemá přístup k firemnímu dashboardu. Požádej správce firmy o pozvací odkaz.');
        resetSubmit(); hideChooser(); showGate();
        return;
      }
      if (options.length === 1 && options[0].personal) { enterWorkspace(options[0].id); return; }
      renderChooser(options);
      hideGate(); showChooser();
    }

    gateSubmit.addEventListener('click', async () => {
      gateError.style.display = 'none';
      const email = document.getElementById('gate-email').value.trim();
      const password = document.getElementById('gate-password').value;
      if (!email || !password) { showGateError('Vyplň email a heslo.'); return; }
      gateSubmit.disabled = true; gateSubmit.textContent = 'Přihlašuji...';
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { showGateError(translateGateError(error.message)); resetSubmit(); return; }
      await proceed(data.session);
      resetSubmit();
    });

    // Enter key
    document.getElementById('gate-password').addEventListener('keydown', e => { if (e.key === 'Enter') gateSubmit.click(); });
    // Odhlášení z rozcestníku
    document.getElementById('ws-signout').addEventListener('click', async () => {
      await sb.auth.signOut(); window._makejActingId = null; hideChooser(); showGate();
    });

    // Existující session při načtení
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) proceed(session);
      else showGate();
    });
  </script>
